name: Monitor

# 獨立排程，不依賴其他 repo 或系統。公開 repo 的 Actions 不計分鐘額度。
# 每小時第 50 分啟動，連上 Bybit WebSocket 後等到整點，那根 1H K 一收盤就判斷：
# - 盤中爆量：OKX／Bitget／Bybit 三家 1H 成交額異常
# - 短線清單：補處理所有新收盤的 4H K（觸發、T1、停損、T2、逾時）
# - 4H 金叉：Binance 現貨，每根 4H K 收盤後（台灣 00、04、08、12、16、20 點）判斷一次
# - 日線金叉：同上資料源與 EMA20／SMA30，每根日線 K 收盤後（台灣 08:00 後第一輪）判斷一次，獨立 Issue「金叉清單（日線）」
# - 掃流動性：短線／布局／自選標的，每根 4H K 收盤後標記一次（只在網頁，不推播）
# - 借幣利率：OKX 各幣槓桿借幣利率比 7 天中位數暴增就推播（每小時一次）
# - 做空候選：OKX／Bitget／Bybit／Binance 現貨 24h 漲幅榜，名單只在網頁，1H／4H 轉弱才推播（每小時一次）
# - 每日掃描：台灣時間 09:00 後當天第一輪（布局清單等 Bybit 成交檔 09:12 公布後才跑）
# GitHub 排程可能延遲或略過：晚於整點才啟動時改評估上一小時（Bybit 該小時會缺），
# 每日掃描與 4H 追蹤則由下一輪自動補上。
# mode=intrahour：每小時第 15、30、45 分由 Cloudflare Worker 觸發，只做盤中推算（OKX、Bitget），
# 只寫「盤中預警」Issue；第 48 分之後或同一時段已推算過就直接略過。
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: 每日掃描（auto＝台灣時間 09:00 後當天第一輪；force＝現在就跑；skip＝只追蹤）。在第 40–59 分執行會等到整點，連 Bybit 一起判斷盤中爆量
        type: choice
        options: [auto, force, skip]
        default: auto
      mode:
        description: full＝完整一輪；intrahour＝只做盤中推算（第 10–47 分執行才有效）
        type: choice
        options: [full, intrahour]
        default: full

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: signmonitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Load issues
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const label = "signmonitor";
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "fbca04",
                description: "爆量觀察清單與追蹤成績",
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "all", labels: label, per_page: 20,
            });
            async function ensure(title, file, prefix, initial) {
              let issue = issues.find((candidate) => candidate.title === title);
              if (!issue) {
                const created = await github.rest.issues.create({
                  owner, repo, title, labels: [label],
                  body: initial || `# ${title}\n\n第一輪執行後會在這裡顯示。`,
                });
                issue = created.data;
              } else if (issue.state !== "open") {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "open" });
              }
              fs.writeFileSync(file, issue.body || "", "utf8");
              core.setOutput(`${prefix}number`, String(issue.number));
              core.setOutput(`${prefix}url`, issue.html_url);
            }
            await ensure("短線清單", "issue-body.md", "");
            await ensure("布局清單", "layout-body.md", "layout_");
            await ensure("盤中爆量", "hourly-body.md", "hourly_");
            await ensure("自選標的", "watch-body.md", "watch_",
              "# 自選標的\n\n由 signmonitor 網頁管理；也可以直接編輯下面兩行標記之間的內容，一行一個代號（例如 APP、HYPE）。\n\n<!-- WATCHLIST -->\n<!-- /WATCHLIST -->\n");
            await ensure("金叉清單", "cross-body.md", "cross_");
            await ensure("金叉清單（日線）", "crossd-body.md", "crossd_");
            await ensure("行情快照", "snapshot-body.md", "snapshot_");
            await ensure("掃流動性", "sweep-body.md", "sweep_");
            await ensure("量增價平", "quiet-body.md", "quiet_");
            await ensure("盤中預警", "pre-body.md", "pre_");
            await ensure("沉睡甦醒", "dormant-body.md", "dormant_");
            await ensure("借幣利率", "rate-body.md", "rate_");
            await ensure("做空候選", "gainer-body.md", "gainer_");

      - name: Restore Bybit daily cache
        if: ${{ inputs.mode != 'intrahour' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/bybit-daily.json
          key: bybit-daily-${{ github.run_id }}
          restore-keys: bybit-daily-

      - name: Restore dormant cache
        if: ${{ inputs.mode != 'intrahour' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/dormant.json
          key: dormant-${{ github.run_id }}
          restore-keys: dormant-

      - name: Restore rate cache
        if: ${{ inputs.mode != 'intrahour' }}
        uses: actions/cache/restore@v4
        with:
          path: .cache/rates.json
          key: rates-${{ github.run_id }}
          restore-keys: rates-

      - name: Run monitor
        if: ${{ inputs.mode != 'intrahour' }}
        env:
          DAILY_MODE: ${{ inputs.daily || 'auto' }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          LAYOUT_URL: ${{ steps.issue.outputs.layout_url }}
          HOURLY_URL: ${{ steps.issue.outputs.hourly_url }}
          CROSS_URL: ${{ steps.issue.outputs.cross_url }}
          CROSSD_URL: ${{ steps.issue.outputs.crossd_url }}
          QUIET_URL: ${{ steps.issue.outputs.quiet_url }}
          PRE_URL: ${{ steps.issue.outputs.pre_url }}
          DORMANT_URL: ${{ steps.issue.outputs.dormant_url }}
          RATE_URL: ${{ steps.issue.outputs.rate_url }}
          GAINER_URL: ${{ steps.issue.outputs.gainer_url }}
        run: >-
          node src/run.mjs
          --body issue-body.md --layout-body layout-body.md --hourly-body hourly-body.md --watch-body watch-body.md --cross-body cross-body.md --crossd-body crossd-body.md --sweep-body sweep-body.md --quiet-body quiet-body.md --pre-body pre-body.md --dormant-body dormant-body.md --rate-body rate-body.md --gainer-body gainer-body.md
          --bybit-cache .cache/bybit-daily.json --dormant-cache .cache/dormant.json --rate-cache .cache/rates.json --oi-dir data/oi --rate-dir data/rates --out out
          --daily "$DAILY_MODE" --issue-url "$ISSUE_URL" --layout-url "$LAYOUT_URL" --hourly-url "$HOURLY_URL" --cross-url "$CROSS_URL" --crossd-url "$CROSSD_URL" --quiet-url "$QUIET_URL" --pre-url "$PRE_URL" --dormant-url "$DORMANT_URL" --rate-url "$RATE_URL" --gainer-url "$GAINER_URL"

      - name: Run intrahour
        if: ${{ inputs.mode == 'intrahour' }}
        env:
          PRE_URL: ${{ steps.issue.outputs.pre_url }}
        run: >-
          node src/intrahour.mjs
          --hourly-body hourly-body.md --pre-body pre-body.md --watch-body watch-body.md --out out --pre-url "$PRE_URL"

      - name: Save Bybit daily cache
        if: ${{ always() && inputs.mode != 'intrahour' && hashFiles('.cache/bybit-daily.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/bybit-daily.json
          key: bybit-daily-${{ github.run_id }}

      - name: Save dormant cache
        if: ${{ always() && inputs.mode != 'intrahour' && hashFiles('.cache/dormant.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/dormant.json
          key: dormant-${{ github.run_id }}

      - name: Save rate cache
        if: ${{ always() && inputs.mode != 'intrahour' && hashFiles('.cache/rates.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/rates.json
          key: rates-${{ github.run_id }}

      - name: Update issues
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          LAYOUT_NUMBER: ${{ steps.issue.outputs.layout_number }}
          HOURLY_NUMBER: ${{ steps.issue.outputs.hourly_number }}
          CROSS_NUMBER: ${{ steps.issue.outputs.cross_number }}
          CROSSD_NUMBER: ${{ steps.issue.outputs.crossd_number }}
          SNAPSHOT_NUMBER: ${{ steps.issue.outputs.snapshot_number }}
          SWEEP_NUMBER: ${{ steps.issue.outputs.sweep_number }}
          QUIET_NUMBER: ${{ steps.issue.outputs.quiet_number }}
          PRE_NUMBER: ${{ steps.issue.outputs.pre_number }}
          DORMANT_NUMBER: ${{ steps.issue.outputs.dormant_number }}
          RATE_NUMBER: ${{ steps.issue.outputs.rate_number }}
          GAINER_NUMBER: ${{ steps.issue.outputs.gainer_number }}
          WATCH_NUMBER: ${{ steps.issue.outputs.watch_number }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            async function put(numberEnv, bodyFile, commentFile) {
              const issue_number = Number(process.env[numberEnv]);
              if (fs.existsSync(bodyFile)) {
                await github.rest.issues.update({ owner, repo, issue_number, body: fs.readFileSync(bodyFile, "utf8") });
              }
              if (fs.existsSync(commentFile)) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: fs.readFileSync(commentFile, "utf8") });
              }
            }
            await put("ISSUE_NUMBER", "out/issue-body.md", "out/comment.md");
            await put("LAYOUT_NUMBER", "out/layout-body.md", "out/layout-comment.md");
            await put("HOURLY_NUMBER", "out/hourly-body.md", "out/hourly-comment.md");
            await put("CROSS_NUMBER", "out/cross-body.md", "out/cross-comment.md");
            await put("CROSSD_NUMBER", "out/crossd-body.md", "out/crossd-comment.md");
            await put("SNAPSHOT_NUMBER", "out/snapshot-body.md", "out/none.md");
            await put("SWEEP_NUMBER", "out/sweep-body.md", "out/none.md");
            await put("QUIET_NUMBER", "out/quiet-body.md", "out/quiet-comment.md");
            await put("PRE_NUMBER", "out/pre-body.md", "out/none.md");
            await put("DORMANT_NUMBER", "out/dormant-body.md", "out/none.md");
            await put("RATE_NUMBER", "out/rate-body.md", "out/none.md");
            await put("GAINER_NUMBER", "out/gainer-body.md", "out/none.md");

            // 自選標的：借幣利率推播的幣自動加入（7 天後移出）。讀最新的 Issue 再套用，避免蓋掉網頁剛做的修改。
            try {
              const W = await import(`${process.env.GITHUB_WORKSPACE}/src/watch.mjs`);
              const adds = fs.existsSync("out/watch-auto.json") ? JSON.parse(fs.readFileSync("out/watch-auto.json", "utf8")) : [];
              const issue_number = Number(process.env.WATCH_NUMBER);
              const { data: wi } = await github.rest.issues.get({ owner, repo, issue_number });
              const r = W.applyAuto(wi.body || "", adds, Date.now());
              if (r.changed) {
                await github.rest.issues.update({ owner, repo, issue_number, body: r.body });
                core.info(`自選：加入 ${r.added.join(",") || "-"}；延長 ${r.renewed.join(",") || "-"}；到期移出 ${r.removed.join(",") || "-"}`);
              }
            } catch (error) {
              core.warning(`自選自動更新失敗：${error.message}`);
            }

      - name: Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/notify.mjs out

      # 把這輪發出的 Telegram 訊息（logs/telegram/）、OI 紀錄（data/oi/）、借幣利率紀錄（data/rates/）存回 repo，失敗不影響監控本身。
      - name: Save Telegram log
        if: ${{ always() }}
        continue-on-error: true
        run: |
          for d in logs/telegram data/oi data/rates; do if [ -d "$d" ]; then git add "$d"; fi; done
          if git diff --cached --quiet; then echo "沒有新的發送紀錄"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "log: Telegram 發送紀錄、OI、借幣利率"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

      # 公開 repo 連續 60 天沒有新 commit，GitHub 會自動停用排程。
      # 每週一的每日掃描順便重新啟用一次本 workflow，避免被停用。
      - name: Keep schedule alive
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            if (now.getUTCDay() !== 1 || now.getUTCHours() !== 2) return;
            await github.rest.actions.enableWorkflow({
              owner: context.repo.owner, repo: context.repo.repo, workflow_id: "monitor.yml",
            });
